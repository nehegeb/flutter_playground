name: flutter_playground
description: "A Flutter playground for testing new stuff."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter 
  go_router: ^13.2.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  pointycastle: ^4.0.0
  uuid: ^4.3.3
  lorem_ipsum: ^0.0.3
  country_flags: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/app/licensing/data/
    - lib/app/localization/data/
    - lib/app/user/data/
    - lib/app/modules/data/
    - lib/app/roles/data/
    # Changelogs
    - lib/app/changelog/data/
    - lib/modules/template/changelog/
    - lib/modules/settings/changelog/
    # Assets
    - assets/app/images/
    - assets/modules/template/images/
    - assets/modules/settings/images/
