name: flutter_playground
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter 
  go_router: ^13.2.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  pluto_grid: ^7.0.0
  lorem_ipsum: ^0.0.3
  country_flags: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/app/licensing/data/
    - lib/app/localization/data/
    # Changelogs
    - lib/app/changelog/data/
    - lib/modules/dashboard/changelog/
    - lib/modules/template/changelog/
    # Assets
    - assets/app/images/
